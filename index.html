<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake Control Board · RCCB IT</title>

  <!-- Chart library (no React needed) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    /* ============================================================
       WIRE-UP CHECKLIST
       1. Paste your full Power Automate HTTP trigger URL into
          FLOW_URL below (the const near the top of the <script>).
       2. Update mapItem() so the field names on the right match
          your SharePoint list's *internal* column names.
          Go to: List Settings → click a column → read "Field=" in URL.
          Common gotcha: "Project Lead" → Project_x0020_Lead
       3. Push index.html to your GitHub Pages branch. Done.
       ============================================================ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #60a5fa;
      --purple: #a78bfa;
      --amber:  #f59e0b;
      --green:  #34d399;
      --signal: #ff5638;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--sans);
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    /* ── Animations ── */
@keyframes hubSweep {
  0%   { transform: translateX(-200px); }
  100% { transform: translateX(110vw); }
}
@keyframes hubPulse {
  0%, 100% { opacity: .3; transform: scale(1); }
  50%       { opacity: 1;  transform: scale(1.3); }
}
@keyframes hubGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,86,56,.7); }
  50%       { box-shadow: 0 0 0 6px rgba(255,86,56,0); }
}
.hub-pulse {
  animation: hubPulse 1.4s ease-in-out infinite, hubGlow 1.4s ease-in-out infinite;
}
.hub-sweep { animation: hubSweep 3.5s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .hub-pulse, .hub-sweep { animation: none !important; }
}
    /* ── Header ── */
    #board-header {
      position: relative;
      overflow: hidden;
      background: radial-gradient(120% 140% at 12% -10%, #1a1f2b 0%, #0b0d12 55%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 28px 24px 36px;
    }
    #board-header .grid-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 95%);
      mask-image: linear-gradient(to bottom, #000 30%, transparent 95%);
    }
    #board-header .inner {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* top bar */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .org-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #64748b;
    }
    .top-bar-right { display: flex; align-items: center; gap: 14px; }
    #clock {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      color: #475569;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(255,86,56,.35);
      border-radius: 999px;
      padding: 4px 10px;
    }
   .live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--signal);
  display: inline-block;
  box-shadow: 0 0 8px var(--signal);
}
    .live-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    /* title */
    #board-title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 600;
      color: #fff;
      letter-spacing: -.02em;
      line-height: 1.05;
      margin-bottom: 8px;
    }
    #board-sub {
      font-size: 13px;
      color: #64748b;
      line-height: 1.65;
      max-width: 520px;
    }

    /* conveyor */
    .conveyor-wrap {
      position: relative;
      margin-top: 32px;
    }
    .conveyor-line {
  position: absolute; left: 0; right: 0;
  height: 2px; top: 22px;
  background: rgba(255,255,255,.18);
  overflow: hidden;
  border-radius: 2px;
}
.conveyor-sweep {
  position: absolute; top: 0;
  height: 2px; width: 180px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,86,56,.4) 30%,
    var(--signal) 50%,
    rgba(255,86,56,.4) 70%,
    transparent 100%);
  box-shadow: 0 0 10px var(--signal);
  filter: blur(.3px);
}
    .conveyor-stages {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    @media (max-width: 560px) {
      .conveyor-stages { grid-template-columns: repeat(2, 1fr); gap: 24px 0; }
    }
    .stage-item {
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    .stage-dot-ring {
      width: 44px; height: 44px; border-radius: 50%;
      background: #0b0d12;
      display: grid; place-items: center;
      border: 1px solid;
    }
    .stage-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .stage-count {
      font-family: var(--mono);
      font-size: 22px; font-weight: 600;
      color: #fff;
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }
    .stage-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #64748b;
      margin-top: 3px;
    }

    /* readouts */
    .readouts {
      display: flex; flex-wrap: wrap;
      gap: 8px 24px;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .readout { display: flex; align-items: baseline; gap: 8px; }
    .readout-key {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #64748b;
    }
    .readout-val {
      font-family: var(--mono);
      font-size: 13px; font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    /* ── Main ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Charts row ── */
    #charts-row {
      display: none;
      grid-template-columns: 3fr 2fr;
      gap: 16px;
    }
    @media (max-width: 700px) {
      #charts-row { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .card-title {
      font-size: 13px; font-weight: 600;
      color: #0f172a;
      margin-bottom: 14px;
    }
    .card-title-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-total {
      font-family: var(--mono);
      font-size: 11px;
      color: #94a3b8;
    }

    /* bar chart canvas */
    #team-chart-wrap { height: 200px; position: relative; }

    /* status mix bars */
    .mix-item { margin-bottom: 12px; }
    .mix-item:last-child { margin-bottom: 0; }
    .mix-row {
      display: flex; justify-content: space-between;
      font-size: 12px; margin-bottom: 5px;
    }
    .mix-name { font-weight: 500; color: #475569; }
    .mix-nums { font-family: var(--mono); color: #94a3b8; }
    .mix-track {
      height: 5px; background: #f1f5f9;
      border-radius: 99px; overflow: hidden;
    }
    .mix-fill { height: 100%; border-radius: 99px; transition: width .4s; }

    /* ── Requests card ── */
    #requests-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }
    .requests-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
    }
    .requests-header-left { display: flex; align-items: center; gap: 8px; }
    .requests-title { font-size: 13px; font-weight: 600; color: #0f172a; }
    #refresh-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: none; background: transparent; cursor: pointer;
      display: grid; place-items: center;
      color: #94a3b8;
      transition: background .15s, color .15s;
    }
    #refresh-btn:hover { background: #f1f5f9; color: #475569; }
    #refresh-btn svg { width: 14px; height: 14px; }

    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      width: 13px; height: 13px; color: #94a3b8; pointer-events: none;
    }
    #search {
      width: 160px;
      padding: 6px 10px 6px 28px;
      font-size: 12px;
      font-family: var(--sans);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    #search:focus { border-color: #94a3b8; background: #fff; }
    #search::placeholder { color: #94a3b8; }

    /* filter pills */
    #filter-pills {
      display: none;
      flex-wrap: wrap; gap: 6px;
      padding: 10px 18px;
      border-bottom: 1px solid #f1f5f9;
    }
    .pill-btn {
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px; font-weight: 500;
      border: 1px solid #e2e8f0;
      background: #fff; color: #475569;
      cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .pill-btn.active {
      background: #0b0d12; color: #fff; border-color: #0b0d12;
    }
    .pill-count {
      font-family: var(--mono);
      margin-left: 5px; opacity: .6;
    }

    /* table */
    #table-area { overflow-x: auto; }
    table {
      width: 100%; min-width: 580px;
      border-collapse: collapse;
      text-align: left;
    }
    thead tr { border-bottom: 1px solid #f1f5f9; }
    th {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: .12em;
      color: #94a3b8;
      padding: 10px 16px;
    }
    tbody tr {
      border-bottom: 1px solid #f8fafc;
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    td { padding: 10px 16px; }

    .req-cell { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 8px;
      background: #f1f5f9;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700; color: #475569;
    }
    .req-title { font-size: 13px; font-weight: 500; color: #0f172a; }
    .req-name  { font-size: 12px; color: #334155; }
    .req-team  { font-size: 12px; color: #94a3b8; }
    .req-lead  { font-size: 12px; color: #475569; }
    .req-date  { font-family: var(--mono); font-size: 11px; color: #94a3b8; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 999px; border: 1px solid;
      padding: 2px 10px;
      font-size: 11px; font-weight: 500;
      white-space: nowrap;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* footer bar */
    #footer-bar {
      display: none;
      align-items: center; justify-content: space-between;
      padding: 10px 18px;
      border-top: 1px solid #f1f5f9;
    }
    #footer-count { font-family: var(--mono); font-size: 11px; color: #94a3b8; }
    .footer-src {
      font-size: 11px; color: #94a3b8;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .footer-src svg { width: 11px; height: 11px; }

    /* ── Skeleton ── */
    .skeleton-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #f8fafc; }
    .skel { background: #f1f5f9; border-radius: 6px; }
    .skel-avatar { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
    .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .skel-line-a { height: 11px; width: 38%; }
    .skel-line-b { height: 9px;  width: 55%; }
    .skel-pill  { width: 72px; height: 20px; border-radius: 99px; }

    /* ── Empty / error ── */
    #empty-state {
      padding: 56px 24px;
      text-align: center;
    }
    .empty-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: grid; place-items: center;
      margin: 0 auto 14px;
    }
    .empty-icon svg { width: 22px; height: 22px; }
    .empty-heading { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
    .empty-body {
      font-size: 12px; color: #64748b;
      max-width: 380px; margin: 0 auto 18px;
      line-height: 1.65;
    }
    .empty-body code {
      font-family: var(--mono);
      font-size: 11px;
      background: #f1f5f9;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 18px;
      border-radius: 8px;
      background: #0f172a; color: #fff;
      border: none; font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .retry-btn:hover { background: #1e293b; }
    .retry-btn svg { width: 14px; height: 14px; }

    .no-match {
      padding: 48px 24px;
      text-align: center;
      font-size: 13px; color: #64748b;
    }
    #board-header::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--signal), transparent);
  background-size: 200% 100%;
  animation: topBar 4s linear infinite;
  z-index: 2;
}
@keyframes topBar {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     HEADER / CONTROL BOARD
═══════════════════════════════════════════════════ -->
<header id="board-header">
  <div class="grid-overlay"></div>
  <div class="inner">

    <div class="top-bar">
      <span class="org-label">RCCB · IT&nbsp;Automation</span>
      <div class="top-bar-right">
        <span id="clock"></span>
        <span class="live-badge">
          <span class="live-dot hub-pulse"></span>
          <span class="live-label">LIVE</span>
        </span>
      </div>
    </div>

    <h1 id="board-title">Intake Control Board</h1>
    <p id="board-sub">Every automation request the team takes in — from first submission to shipped — moving across one board.</p>

    <div class="conveyor-wrap">
      <div class="conveyor-line">
        <div class="conveyor-sweep hub-sweep"></div>
      </div>
      <div class="conveyor-stages" id="conveyor"></div>
    </div>

    <div class="readouts" id="readouts"></div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════
     MAIN
═══════════════════════════════════════════════════ -->
<main>

  <!-- Charts row (hidden until data loads) -->
  <div id="charts-row">
    <div class="card">
      <div class="card-title-row">
        <span class="card-title">Intake by team</span>
        <span class="card-total" id="chart-total"></span>
      </div>
      <div id="team-chart-wrap">
        <canvas id="team-chart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Status mix</div>
      <div id="status-mix"></div>
    </div>
  </div>

  <!-- Requests table card -->
  <div id="requests-card">
    <div class="requests-header">
      <div class="requests-header-left">
        <span class="requests-title">Requests</span>
        <button id="refresh-btn" title="Refresh from SharePoint" onclick="load()">
          <!-- refresh icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="search" type="text" placeholder="Search…" oninput="renderTable()" />
      </div>
    </div>

    <div id="filter-pills"></div>
    <div id="table-area"></div>
    <div id="footer-bar">
      <span id="footer-count"></span>
      <span class="footer-src">
        Source: SharePoint
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7h10v10"/><path d="M7 17 17 7"/>
        </svg>
      </span>
    </div>
  </div>

</main>

<script>
  /* ================================================================
     CONFIG — edit these two things and you're done
     ================================================================ */

  // 1. Paste your full Power Automate HTTP trigger URL here.
  //    It must include the ?api-version=...&sp=...&sv=...&sig=... params.
  const FLOW_URL =
    "https://a477fe69c32a4af79331a1752086c6.34.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a1a2a818907c499992855167195cb1e6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=L4dmM-57GdhVLTSDxZGwJ8FzJ5PwWfZq1ZKgfp54EVM";

 function mapItem(it) {
  // Person field — array of user objects → grab DisplayName
  const requesterObj = Array.isArray(it.field_2) ? it.field_2[0] : null;

  // Project Lead — multi-choice array → grab .Value
  const leadObj = Array.isArray(it.field_7) ? it.field_7[0] : null;

  // Request Status — multi-choice array → grab .Value
  const statusObj = Array.isArray(it.field_8) ? it.field_8[0] : null;

  return {
    id:        it.ID,
    title:     it.field_1 || "Untitled request",
    requester: requesterObj?.DisplayName || "—",
    team:      it.Team_x002f_Department1?.Value || "—",
    lead:      leadObj?.Value || "—",
    status:    statusObj?.Value || "New",
    submitted: it.Created,

    // bonus fields ready to use
    reqNumber: it.Title,                       // "REQ-0019"
    typeReq:   it.TypeofRequest?.Value,        // "Create a New Automation..."
    useCase:   it.TypeofUseCase?.Value,        // "Workflow Automation"
    desc:      it.field_6,                     // description text
  };
}

  /* ================================================================
     CONSTANTS
     ================================================================ */
  const STAGES = ["New", "In Progress", "On Hold", "Completed"];
  const HUE = {
    "New":         "#60a5fa",
    "In Progress": "#a78bfa",
    "On Hold":     "#f59e0b",
    "Completed":   "#34d399",
  };

  let allRecords   = [];
  let activeFilter = "All";
  let teamChart    = null;

  /* ================================================================
     UTILITIES
     ================================================================ */
  function pad2(n)      { return String(n).padStart(2, "0"); }
  function initials(n)  {
    return (n || "?").split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  }
  function fmtDate(v) {
    if (!v) return "—";
    const d = new Date(v);
    return isNaN(d) ? String(v) : d.toLocaleDateString("en-US", { month: "short", day: "2-digit" });
  }
  function counts(records) {
    const c = { New: 0, "In Progress": 0, "On Hold": 0, Completed: 0 };
    records.forEach(r => { if (c[r.status] != null) c[r.status]++; });
    return c;
  }

  /* ================================================================
     CLOCK
     ================================================================ */
  function tickClock() {
    document.getElementById("clock").textContent =
      new Date().toLocaleString("en-US", {
        month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit"
      }).toUpperCase();
  }
  tickClock();
  setInterval(tickClock, 30000);

  /* ================================================================
     HEADER — conveyor + readouts
     ================================================================ */
  function renderConveyor(c) {
    document.getElementById("conveyor").innerHTML = STAGES.map(s => `
      <div class="stage-item">
        <span class="stage-dot-ring" style="border-color:${HUE[s]}66;">
          <span class="stage-dot" style="background:${HUE[s]};"></span>
        </span>
        <span class="stage-count">${pad2(c[s] || 0)}</span>
        <span class="stage-label">${s}</span>
      </div>
    `).join("");
  }

  function renderReadouts(records, c) {
    const open = (c.New || 0) + (c["In Progress"] || 0) + (c["On Hold"] || 0);
    document.getElementById("readouts").innerHTML = [
      ["Total intake", pad2(records.length), null],
      ["Open",         pad2(open),            null],
      ["Shipped",      pad2(c.Completed || 0), HUE.Completed],
    ].map(([k, v, accent]) => `
      <div class="readout">
        <span class="readout-key">${k}</span>
        <span class="readout-val" style="${accent ? `color:${accent}` : ""}">${v}</span>
      </div>
    `).join("");
  }

  /* ================================================================
     CHARTS
     ================================================================ */
  function renderCharts(records, c) {
    document.getElementById("charts-row").style.display = "grid";
    document.getElementById("chart-total").textContent  = `${records.length} total`;

    // Team bar chart
    const byTeam = Object.entries(
      records.reduce((m, r) => { m[r.team] = (m[r.team] || 0) + 1; return m; }, {})
    ).sort((a, b) => b[1] - a[1]).slice(0, 7);

    if (teamChart) teamChart.destroy();
    teamChart = new Chart(document.getElementById("team-chart"), {
      type: "bar",
      data: {
        labels:   byTeam.map(([t]) => t),
        datasets: [{ data: byTeam.map(([,n]) => n), label: "Requests",
          backgroundColor: "#1f2430", borderRadius: 5, maxBarThickness: 38 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 }, color: "#64748b" } },
          y: { grid: { color: "#f1f5f9" }, ticks: { font: { size: 11 }, color: "#94a3b8", precision: 0 }, border: { display: false } },
        },
      },
    });

    // Status mix
    document.getElementById("status-mix").innerHTML = STAGES.map(s => {
      const pct = records.length ? Math.round((c[s] / records.length) * 100) : 0;
      return `
        <div class="mix-item">
          <div class="mix-row">
            <span class="mix-name">${s}</span>
            <span class="mix-nums">${c[s]} · ${pct}%</span>
          </div>
          <div class="mix-track">
            <div class="mix-fill" style="width:${pct}%;background:${HUE[s]};"></div>
          </div>
        </div>`;
    }).join("");
  }

  /* ================================================================
     FILTER PILLS
     ================================================================ */
  function renderPills(c) {
    const el = document.getElementById("filter-pills");
    el.style.display = "flex";
    el.innerHTML = ["All", ...STAGES].map(s => {
      const on = activeFilter === s;
      return `<button class="pill-btn${on ? " active" : ""}" onclick="setFilter('${s}')">
        ${s}${s !== "All" ? `<span class="pill-count">${c[s] ?? 0}</span>` : ""}
      </button>`;
    }).join("");
  }

  function setFilter(f) { activeFilter = f; renderTable(); }

  /* ================================================================
     TABLE
     ================================================================ */
  function renderTable() {
    const c   = counts(allRecords);
    renderConveyor(c);
    renderReadouts(allRecords, c);
    renderPills(c);

    const q    = (document.getElementById("search").value || "").toLowerCase().trim();
    let rows   = allRecords;
    if (activeFilter !== "All") rows = rows.filter(r => r.status === activeFilter);
    if (q) rows = rows.filter(r =>
      (r.title + r.requester + r.team + r.lead).toLowerCase().includes(q)
    );

    const area = document.getElementById("table-area");

    if (rows.length === 0) {
      area.innerHTML = `<div class="no-match">Nothing matches — clear the search or change the filter.</div>`;
    } else {
      area.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Request</th>
              <th>Requester / Team</th>
              <th>Lead</th>
              <th>Status</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const hue = HUE[r.status] || "#94a3b8";
              return `
                <tr>
                  <td>
                    <div class="req-cell">
                      <span class="avatar">${initials(r.requester)}</span>
                      <span class="req-title">${r.title}</span>
                    </div>
                  </td>
                  <td>
                    <div class="req-name">${r.requester}</div>
                    <div class="req-team">${r.team}</div>
                  </td>
                  <td><span class="req-lead">${r.lead}</span></td>
                  <td>
                    <span class="status-pill" style="border-color:${hue}55;background:${hue}14;color:#334155;">
                      <span class="status-dot" style="background:${hue};"></span>
                      ${r.status}
                    </span>
                  </td>
                  <td><span class="req-date">${fmtDate(r.submitted)}</span></td>
                </tr>`;
            }).join("")}
          </tbody>
        </table>`;
    }

    const footer = document.getElementById("footer-bar");
    footer.style.display = "flex";
    document.getElementById("footer-count").textContent =
      `${rows.length} shown · ${allRecords.length} total`;
  }

  /* ================================================================
     SKELETON
     ================================================================ */
  function showSkeleton() {
    document.getElementById("table-area").innerHTML =
      Array.from({ length: 6 }).map(() => `
        <div class="skeleton-row">
          <div class="skel skel-avatar"></div>
          <div class="skel-lines">
            <div class="skel skel-line-a"></div>
            <div class="skel skel-line-b"></div>
          </div>
          <div class="skel skel-pill"></div>
        </div>`).join("");
    renderConveyor({ New: 0, "In Progress": 0, "On Hold": 0, Completed: 0 });
    renderReadouts([], { New: 0, "In Progress": 0, "On Hold": 0, Completed: 0 });
  }

  /* ================================================================
     ERROR / EMPTY STATE
     ================================================================ */
  function showError(msg) {
    document.getElementById("table-area").innerHTML = `
      <div id="empty-state">
        <div class="empty-icon" style="background:#fef2f2;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <path d="M12 9v4"/><path d="M12 17h.01"/>
          </svg>
        </div>
        <p class="empty-heading">Couldn't reach the list</p>
        <p class="empty-body">${msg || `Check the Flow URL and that <code>mapItem()</code> field names match your SharePoint list's internal column names.`}</p>
        <button class="retry-btn" onclick="load()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
          Try again
        </button>
      </div>`;
  }

  function showEmpty() {
    document.getElementById("table-area").innerHTML = `
      <div id="empty-state">
        <div class="empty-icon" style="background:#f1f5f9;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <p class="empty-heading">Waiting on your SharePoint list</p>
        <p class="empty-body">Once the Flow returns items they land here — no records are stored in this page.</p>
        <button class="retry-btn" onclick="load()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
          Refresh
        </button>
      </div>`;
  }

  /* ================================================================
     FETCH + LOAD
     ================================================================ */
  async function load() {
    showSkeleton();
    document.getElementById("charts-row").style.display = "none";
    document.getElementById("filter-pills").style.display = "none";
    document.getElementById("footer-bar").style.display = "none";

    try {
      const res = await fetch(FLOW_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });

      if (!res.ok) {
        const detail = await res.text().catch(() => "");
        throw new Error(`Flow responded ${res.status}${detail ? " — " + detail.slice(0, 200) : ""}`);
      }

      const data = await res.json();
      // If your Flow wraps results differently (e.g. data.items or data.d.results) update below.
      allRecords = (data.value || []).map(mapItem);

      if (allRecords.length === 0) {
        showEmpty();
        renderConveyor({ New: 0, "In Progress": 0, "On Hold": 0, Completed: 0 });
        renderReadouts([], { New: 0, "In Progress": 0, "On Hold": 0, Completed: 0 });
      } else {
        const c = counts(allRecords);
        renderCharts(allRecords, c);
        renderTable();
      }
    } catch (e) {
      console.error(e);
      showError(e.message);
    }
  }

  // Kick off on page load
  load();
</script>
</body>
</html>
